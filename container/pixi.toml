# Software for the RNAseq_STAR container image (Dockerfile). The same versions as the Ceres runs: HTStream 1.3.3,
# SAMtools 1.17, Python 3.11 with requirements.txt. STAR is the official 2.7.11b static binary, added by the
# Dockerfile with the checksum 0_Setup/4_fetch_star.py uses.
[workspace]
name = "rnaseq_star"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
htstream = "1.3.3.*"
samtools = "1.17.*"
pigz = "*"
coreutils = "*"
gzip = "*"

[pypi-dependencies]
biopython = "==1.88"
numpy = "==2.4.6"
packaging = "==26.3"
pandas = "==3.0.5"
python-dateutil = "==2.9.0.post0"
scipy = "==1.17.1"
six = "==1.17.0"
